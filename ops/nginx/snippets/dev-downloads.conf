# Redacted developer database + assets archive, handed to new ORK contributors.
# Basic auth; credentials in /etc/nginx/.htpasswd-devdownloads.
#
# Included from BOTH sites-available/blue and sites-available/green so it
# survives a greenblue.sh colour swap (that script rewrites sites-enabled/default).
#
# Tracked in git at ops/nginx/snippets/dev-downloads.conf -- deployed by hand.

location /dev-downloads/ {
	alias /var/www/ork-dev-downloads/;
	autoindex on;
	auth_basic "ORK dev downloads";
	auth_basic_user_file /etc/nginx/.htpasswd-devdownloads;
	add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
}
